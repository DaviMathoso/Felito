ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        FallbackResource /index.php
    </Directory>

    RedirectMatch ^/referencia$ /referencia/
    Alias /referencia/ /var/www/html/html_Referencia/
    <Directory /var/www/html/html_Referencia>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex Felito_Catalogo.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
